# Example consumer workflow. Copy this into your own repository at
# .github/workflows/blindspot.yml to fail CI when a dependency's maintainers
# have published a security advisory that OSV-based scanners do not report.
# To show them as code scanning alerts instead, see blindspot-code-scanning.yml.
#
# Made with AI agents working for MV2 of Munim, Inc. Apache-2.0.
name: Advisory blind-spot check

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 7 * * 1"  # weekly: catch advisories published after you merged

permissions:
  contents: read

jobs:
  blindspot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Best: point at your lock file, so every direct and transitive dependency
      # is checked at its exact version (uv.lock, poetry.lock, pylock.toml,
      # Pipfile.lock, package-lock.json, npm-shrinkwrap.json, yarn.lock,
      # pnpm-lock.yaml).
      - uses: munimtechnologies/advisory-import-census@v0.9.9
        with:
          lock: uv.lock
          fail-on-blind: "true"
          # Accept a reviewed blind spot (no fix yet, or risk accepted) by id,
          # and keep the gate on for everything else:
          # ignore: |
          #   GHSA-xxxx-xxxx-xxxx
          #   CVE-2026-12345

      # No lock file? A requirements.txt (hashed pip-compile output is fine):
      # - uses: munimtechnologies/advisory-import-census@v0.9.9
      #   with:
      #     requirements: requirements.txt

      # Python project that declares its deps in pyproject.toml
      # (PEP 621 [project] or Poetry; the runner's python3 is 3.11+):
      # - uses: munimtechnologies/advisory-import-census@v0.9.9
      #   with:
      #     pyproject: pyproject.toml

      # Node project:
      # - uses: munimtechnologies/advisory-import-census@v0.9.9
      #   with:
      #     lock: package-lock.json   # or yarn.lock / pnpm-lock.yaml

      # A self-hosted app you run from source (no package on a registry):
      # - uses: munimtechnologies/advisory-import-census@v0.9.9
      #   with:
      #     packages: "repo:langgenius/dify@1.4.0"
