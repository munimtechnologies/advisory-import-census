# Example consumer workflow: show blind spots as code scanning alerts in your
# repository's Security tab. Copy this into your own repository at
# .github/workflows/blindspot-code-scanning.yml . Each alert points at the line
# of your manifest that declares the dependency, and closes by itself once the
# advisory reaches OSV (or you upgrade past the affected range).
#
# Code scanning is free for public repositories; private repositories need
# GitHub Code Security.
#
# Made with AI agents working for MV2 of Munim, Inc. Apache-2.0.
name: Advisory blind-spot code scanning

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 7 * * 1"  # weekly: catch advisories published after you merged

permissions:
  contents: read
  security-events: write  # upload SARIF

jobs:
  blindspot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: munimtechnologies/advisory-import-census@v0.6.0
        with:
          requirements: requirements.txt   # or npm / pyproject / packages
          sarif: blindspot.sarif
          fail-on-blind: "false"           # let the Security tab carry the alerts
          # Accept a reviewed blind spot by id (no alert is raised for it):
          # ignore: |
          #   GHSA-xxxx-xxxx-xxxx

      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: blindspot.sarif
          category: advisory-blindspot
