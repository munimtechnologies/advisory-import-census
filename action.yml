name: "Advisory blind-spot check"
description: >-
  Flag security advisories your dependencies' maintainers published on GitHub
  that OSV-based scanners (Dependabot, pip-audit, osv-scanner, npm audit) do not
  report. Public, read-only metadata; standard library only; no install.
author: "MV2 of Munim, Inc."
branding:
  icon: "eye-off"
  color: "purple"

inputs:
  requirements:
    description: "Whitespace-separated pip requirements.txt paths to check."
    required: false
    default: ""
  npm:
    description: "Whitespace-separated package-lock.json / package.json paths to check."
    required: false
    default: ""
  pyproject:
    description: >-
      Whitespace-separated pyproject.toml paths to check (PEP 621 [project]
      dependencies or legacy Poetry). The runner's python3 is 3.11+, so the
      standard-library tomllib reads them with no install.
    required: false
    default: ""
  packages:
    description: >-
      Whitespace-separated ECOSYSTEM:NAME[==VERSION] specs, e.g.
      'pip:vllm==0.10.1 npm:flowise@3.1.3 repo:langgenius/dify@1.4.0'.
    required: false
    default: ""
  map:
    description: >-
      Whitespace-separated NAME=OWNER/REPO overrides for packages whose registry
      has no GitHub link.
    required: false
    default: ""
  ignore:
    description: >-
      Whitespace- or newline-separated advisory ids (GHSA or CVE) to accept as
      known blind spots: each is still listed, as accepted, but does not count
      and does not fail the job. Use for a gap you have reviewed and chosen to
      accept, instead of turning fail-on-blind off for everything.
    required: false
    default: ""
  fail-on-blind:
    description: "Fail the job (exit 1) if any blind spot is found."
    required: false
    default: "true"
  sarif:
    description: >-
      Path to also write the blind spots as a SARIF 2.1.0 file, for
      github/codeql-action/upload-sarif, so they show as code scanning alerts in
      the repository's Security tab. Empty (the default) writes no file.
    required: false
    default: ""
  github-token:
    description: >-
      Token for api.github.com, to raise the 60 requests/hour anonymous limit.
      Only sent to api.github.com. Defaults to the workflow token.
    required: false
    default: ${{ github.token }}

outputs:
  sarif-file:
    description: "Path of the SARIF file written (empty when the sarif input is not set)."
    value: ${{ steps.blindspot.outputs.sarif-file }}

runs:
  using: "composite"
  steps:
    - name: Run advisory blind-spot check
      id: blindspot
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        BLINDSPOT_REQUIREMENTS: ${{ inputs.requirements }}
        BLINDSPOT_NPM: ${{ inputs.npm }}
        BLINDSPOT_PYPROJECT: ${{ inputs.pyproject }}
        BLINDSPOT_PACKAGES: ${{ inputs.packages }}
        BLINDSPOT_MAP: ${{ inputs.map }}
        BLINDSPOT_IGNORE: ${{ inputs.ignore }}
        BLINDSPOT_FAIL_ON_BLIND: ${{ inputs.fail-on-blind }}
        BLINDSPOT_SARIF: ${{ inputs.sarif }}
      run: |
        set -euo pipefail
        args=()
        for f in $BLINDSPOT_REQUIREMENTS; do args+=(-r "$f"); done
        for f in $BLINDSPOT_NPM; do args+=(--npm "$f"); done
        for f in $BLINDSPOT_PYPROJECT; do args+=(--pyproject "$f"); done
        for p in $BLINDSPOT_PACKAGES; do args+=(--package "$p"); done
        for m in $BLINDSPOT_MAP; do args+=(--map "$m"); done
        if [ ${#args[@]} -eq 0 ]; then
          echo "advisory-import-census: set at least one of requirements, npm, pyproject or packages." >&2
          exit 2
        fi
        for i in $BLINDSPOT_IGNORE; do args+=(--ignore "$i"); done
        if [ -n "$BLINDSPOT_SARIF" ]; then
          args+=(--sarif "$BLINDSPOT_SARIF")
          # `packages` specs are listed in the workflow file, so their alerts point there.
          # GITHUB_WORKFLOW_REF is owner/repo/.github/workflows/x.yml@refs/...
          anchor="${GITHUB_WORKFLOW_REF:-}"
          anchor="${anchor#*/*/}"
          anchor="${anchor%%@*}"
          if [ -n "$anchor" ]; then args+=(--sarif-anchor "$anchor"); fi
          echo "sarif-file=$BLINDSPOT_SARIF" >> "$GITHUB_OUTPUT"
        fi
        report="${RUNNER_TEMP:-/tmp}/blindspot-report.json"
        python3 "${GITHUB_ACTION_PATH}/blindspot.py" "${args[@]}" --json | tee "$report"
        python3 "${GITHUB_ACTION_PATH}/action_summary.py" "$report"
